<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600">
<title>LucroReal — Imagem do Produto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px;
    height: 600px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #064E3B 0%, #059669 40%, #10B981 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
  }
  .circle1 {
    width: 400px; height: 400px;
    background: white;
    top: -100px; right: -100px;
  }
  .circle2 {
    width: 300px; height: 300px;
    background: white;
    bottom: -80px; left: -80px;
  }

  .phone {
    width: 180px;
    height: 370px;
    background: #0f0f0f;
    border-radius: 28px;
    padding: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
    margin-bottom: 20px;
  }
  .phone-screen {
    width: 164px;
    height: 354px;
    background: white;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .phone-notch {
    height: 24px;
    background: #0f0f0f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .phone-notch span {
    color: white;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .phone-content {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 8px;
  }
  .app-icon {
    width: 18px; height: 18px;
    background: linear-gradient(135deg, #10B981, #059669);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 6px;
    font-weight: 900;
  }
  .app-title {
    font-size: 9px;
    font-weight: 700;
    color: #111;
  }
  .app-live {
    font-size: 7px;
    color: #999;
  }

  .field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f9f9f9;
    border-radius: 8px;
    padding: 5px 8px;
    margin-bottom: 5px;
  }
  .field-label {
    font-size: 7px;
    color: #888;
  }
  .field-value {
    font-size: 10px;
    font-weight: 700;
    color: #111;
  }

  .result-box {
    background: #ECFDF5;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-label {
    font-size: 7px;
    color: #888;
  }
  .result-value {
    font-size: 14px;
    font-weight: 900;
    color: #10B981;
  }
  .score-badge {
    width: 22px; height: 22px;
    background: #10B981;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    font-weight: 900;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-top: 8px;
  }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ddd;
  }
  .dot.active {
    width: 16px;
    background: #10B981;
    border-radius: 3px;
  }

  .tag {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 16px;
    border-radius: 20px;
    color: white;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  .title {
    position: relative;
    z-index: 2;
    color: white;
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    line-height: 1.2;
    margin-top: 8px;
    letter-spacing: -0.5px;
  }
  .title span {
    color: #6EE7B7;
  }
  .subtitle {
    position: relative;
    z-index: 2;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    text-align: center;
    margin-top: 4px;
  }
  .price {
    position: relative;
    z-index: 2;
    color: white;
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    margin-top: 10px;
    letter-spacing: -1px;
  }
  .price small {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
  }

  .bottom {
    position: absolute;
    bottom: 20px;
    z-index: 2;
    color: rgba(255,255,255,0.4);
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>

  <div class="phone">
    <div class="phone-screen">
      <div class="phone-notch"><span>9:41</span></div>
      <div class="phone-content">
        <div class="app-header">
          <div class="app-icon">LR</div>
          <div>
            <div class="app-title">LucroReal</div>
            <div class="app-live">Ao vivo • Demo</div>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Valor recebido</span>
          <span class="field-value">R$ 32,50</span>
        </div>
        <div class="field">
          <span class="field-label">KM rodados</span>
          <span class="field-value">18 km</span>
        </div>
        <div class="field">
          <span class="field-label">Combustível</span>
          <span class="field-value">R$ 14,80</span>
        </div>

        <div class="result-box">
          <div>
            <div class="result-label">Lucro real</div>
            <div class="result-value">+R$ 17,70</div>
          </div>
          <div class="score-badge">B</div>
        </div>

        <div class="dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="tag">Calculadora de Lucro</div>
  <div class="title">Você sabe quanto<br><span>realmente lucra</span><br>por corrida?</div>
  <div class="subtitle">Uber • 99 • iFood</div>
  <div class="price">R$ 37 <small>/ acesso vitalício</small></div>
  <div class="bottom">LucroReal — lucroreal.app</div>
</body>
</html>
